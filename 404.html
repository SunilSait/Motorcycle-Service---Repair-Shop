<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | Moto Service Pro</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-illustration {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }
        .error-illustration .gear-spin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            opacity: 0.08;
            animation: spin 12s linear infinite;
        }
        .error-subtitle {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            max-width: 420px;
            margin: 0 auto 2.5rem;
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Moto Service Pro Home" style="opacity:0.85;">
        <svg width="36" height="36" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="14" fill="#D4451A"/>
            <path d="M18 34c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="22" cy="38" r="6" stroke="white" stroke-width="3" fill="none"/>
            <circle cx="42" cy="38" r="6" stroke="white" stroke-width="3" fill="none"/>
            <circle cx="22" cy="38" r="2" fill="white"/>
            <circle cx="42" cy="38" r="2" fill="white"/>
            <path d="M28 38h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M30 27l3-7 3 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-top" style="color:#fff;">MOTO</span>
            <span class="brand-bottom">Service Pro</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="max-width:540px;">
        <div class="error-illustration">
            <!-- Spinning gear behind -->
            <svg class="gear-spin" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10l4.5 8a30 30 0 0 1 8 3l8.5-3 2 9.5a30 30 0 0 1 3 8l-3 8.5 9.5 2-3 8.5a30 30 0 0 1-3 8l-8.5-3-2 9.5-8.5-3a30 30 0 0 1-8 3l-4.5 8h-0l-4.5-8a30 30 0 0 1-8-3l-8.5 3-2-9.5a30 30 0 0 1-3-8l3-8.5L10 50l3-8.5a30 30 0 0 1 3-8l8.5 3 2-9.5 8.5 3a30 30 0 0 1 8-3L50 10z" stroke="#D4451A" stroke-width="2"/>
                <circle cx="50" cy="50" r="16" stroke="#D4451A" stroke-width="2"/>
            </svg>
            <div class="error-code">404</div>
        </div>
        <div class="error-subtitle">Page Not Found</div>
        <p class="error-desc">Looks like this road leads nowhere. The page you're looking for has been moved, deleted, or never existed.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg"><i class="fas fa-home"></i> Back to Home</a>
            <a href="contact.html" class="btn btn-lg" style="border-color:rgba(255,255,255,0.2);color:#fff;">Contact Support</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
