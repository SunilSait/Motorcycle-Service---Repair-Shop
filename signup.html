<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Moto Service Pro account to book appointments, track service history, and get exclusive offers.">
    <title>Sign Up | Moto Service Pro — Motorcycle Service & Repair Shop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<!-- Top Bar -->
<div class="auth-topbar">
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Card -->
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
    <div class="auth-card" style="max-width:480px;">
        <!-- Decorative orb -->
        <div style="position:absolute;top:-60px;left:-60px;width:140px;height:140px;background:rgba(16,185,129,0.06);border-radius:50%;filter:blur(30px);pointer-events:none;"></div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="Moto Service Pro Home">
            <img src="logo.svg" alt="Moto Service Pro Logo" width="42" height="42" style="width:42px;height:42px;object-fit:contain;display:block;" />
            <div style="display:flex;flex-direction:column;line-height:1.15;">
                <span style="font-family:var(--font-heading);font-weight:600;font-size:0.9375rem;color:var(--text-heading);">MOTO</span>
                <span style="font-family:var(--font-heading);font-weight:600;font-size:0.625rem;color:var(--primary);text-transform:uppercase;letter-spacing:0.12em;">Service Pro</span>
            </div>
        </a>

        <!-- Header -->
        <div style="text-align:center;margin-bottom:1.75rem;">
            <h1 style="font-size:1.5rem;margin-bottom:0.375rem;">Create Account</h1>
            <p style="font-size:0.875rem;color:var(--text-muted);">Sign up to manage your motorcycle services</p>
        </div>

        <!-- Social Signup -->
        <div class="social-login-grid">
            <button class="social-btn" title="Sign up with Google">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </button>
            <button class="social-btn" title="Sign up with Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            </button>
            <button class="social-btn" title="Sign up with Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">or sign up with email</div>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='login.html';" id="signup-form">
            <div class="form-group">
                <label class="form-label" for="signup-fname">First Name</label>
                <input type="text" id="signup-fname" class="form-input" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-lname">Last Name</label>
                <input type="text" id="signup-lname" class="form-input" placeholder="Last name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-phone">Phone Number</label>
                <input type="tel" id="signup-phone" class="form-input" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required minlength="8">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this.querySelector('i'))">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="signup-confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" required minlength="8">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-confirm', this.querySelector('i'))">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="checkbox-wrapper" style="margin-bottom:1.5rem;">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#" class="link-primary">Terms of Service</a> and <a href="#" class="link-primary">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg">Create Account</button>
        </form>

        <!-- Footer link -->
        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
            Already have an account? <a href="login.html" class="link-primary">Login</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
