<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is coming soon. Subscribe for updates on new features and services from Moto Service Pro.">
    <title>Coming Soon | Moto Service Pro — Motorcycle Service & Repair Shop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 480px;
            margin: 2rem auto;
            width: 100%;
        }
        .countdown-item {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-xl);
            padding: 1.25rem 0.75rem;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .dark .countdown-item {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }
        .countdown-value {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 2rem;
            color: var(--primary);
            line-height: 1.1;
            animation: countDown 2s ease-in-out infinite;
        }
        .countdown-label {
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
            font-family: var(--font-heading);
            font-weight: 600;
        }
        .subscribe-form {
            display: flex;
            gap: 0.5rem;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }
        .subscribe-form input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            border: 1.5px solid var(--border-default);
            border-radius: var(--radius-lg);
            color: var(--text-heading);
            font-family: var(--font-body);
            font-size: 0.875rem;
            outline: none;
            transition: var(--transition-fast);
        }
        .subscribe-form input:focus {
            border-color: var(--primary);
        }
        .subscribe-form input::placeholder {
            color: var(--text-muted);
        }
        .dark .subscribe-form input {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            color: #fff;
        }
        .coming-title {
            color: var(--text-heading);
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 0.75rem;
        }
        .coming-desc {
            color: var(--text-body);
            font-size: 1rem;
            max-width: 420px;
            margin: 0 auto;
        }
        .coming-socials {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2.5rem;
        }
        .coming-social-link {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border-default);
            color: var(--text-body);
            background: var(--bg-card);
            transition: var(--transition-fast);
        }
        .coming-social-link:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-subtle);
        }
        .dark .coming-social-link {
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            background: transparent;
        }
        .dark .coming-social-link:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(16,185,129,0.1);
        }
        @media (max-width: 480px) {
            .countdown-grid {
                gap: 0.5rem;
                margin: 1.5rem auto;
            }
            .countdown-item {
                padding: 0.75rem 0.25rem;
                border-radius: var(--radius-lg);
            }
            .countdown-value {
                font-size: 1.35rem;
            }
            .countdown-label {
                font-size: 0.5625rem;
                letter-spacing: 0.05em;
            }
            .subscribe-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Moto Service Pro Home">
        <img src="logo.svg" alt="Moto Service Pro Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;" />
        <div class="nav-logo-text">
            <span class="brand-top">MOTO</span>
            <span class="brand-bottom">Service Pro</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Decorative glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(16,185,129,0.08),transparent 65%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="section-label" style="justify-content:center;margin-bottom:1rem;">
                <i class="fas fa-rocket"></i> Under Construction
            </div>
            <h1 class="coming-title">Coming Soon</h1>
            <p class="coming-desc">
                We're working on something exciting. This page will be available soon. Subscribe to get notified!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">28</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">14</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-mins">36</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">52</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe -->
            <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this page launches.'); this.reset();">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <!-- Social -->
            <div class="coming-socials">
                <a href="#" class="coming-social-link" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="coming-social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="coming-social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" class="coming-social-link" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();

        // Simple countdown timer (30 days from now)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
