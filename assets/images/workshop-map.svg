<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for Cards & Pins -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1f24" flood-opacity="0.25"/>
    </filter>
    <filter id="pin-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Linear Gradients -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D4451A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1F24"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
  </defs>

  <style>
    .land { fill: #f3f0e8; }
    .park { fill: #d4ead4; }
    .industrial { fill: #ece8df; }
    .building { fill: #e5e0d4; stroke: #dbd5c7; stroke-width: 1; }
    .arterial-casing { stroke: #e6b338; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arterial { stroke: #fed049; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .main-casing { stroke: #d3d7dc; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .main-road { stroke: #ffffff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .street-casing { stroke: #dcdfe3; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .street { stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .metro-casing { stroke: #5c6bc0; stroke-width: 4; stroke-dasharray: 8,6; fill: none; }
    .label-road { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #6b7280; font-weight: 600; letter-spacing: 0.5px; }
    .label-area { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #9ca3af; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .label-spot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #4b5563; font-weight: 600; }
  </style>

  <!-- Base Land -->
  <rect width="800" height="500" class="land" />

  <!-- Industrial Zones & Building Blocks -->
  <polygon points="40,20 220,30 200,180 30,160" class="industrial" />
  <polygon points="580,30 760,20 780,190 600,180" class="industrial" />
  <polygon points="40,340 240,320 220,480 30,470" class="industrial" />
  <polygon points="560,340 770,330 780,480 570,470" class="industrial" />

  <!-- Parks / Greenery -->
  <path d="M 260,30 C 320,30 360,60 350,130 C 300,150 250,120 240,70 Z" class="park" />
  <circle cx="280" cy="70" r="14" fill="#b7deb7" opacity="0.8"/>
  <circle cx="310" cy="90" r="18" fill="#b7deb7" opacity="0.8"/>
  <circle cx="290" cy="110" r="12" fill="#b7deb7" opacity="0.8"/>
  <text x="270" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#2d6a4f" font-weight="600">Rajajinagar Park</text>

  <path d="M 450,380 C 520,370 550,420 530,470 C 470,480 430,440 450,380 Z" class="park" />

  <!-- Building Clusters -->
  <rect x="60" y="50" width="45" height="35" rx="3" class="building" />
  <rect x="120" y="55" width="55" height="40" rx="3" class="building" />
  <rect x="70" y="105" width="60" height="40" rx="3" class="building" />
  <rect x="145" y="110" width="40" height="35" rx="3" class="building" />

  <rect x="610" y="50" width="60" height="40" rx="3" class="building" />
  <rect x="685" y="60" width="50" height="35" rx="3" class="building" />
  <rect x="620" y="110" width="50" height="45" rx="3" class="building" />
  <rect x="690" y="115" width="65" height="35" rx="3" class="building" />

  <rect x="60" y="370" width="55" height="40" rx="3" class="building" />
  <rect x="130" y="365" width="60" height="35" rx="3" class="building" />
  <rect x="70" y="425" width="50" height="35" rx="3" class="building" />
  <rect x="140" y="420" width="55" height="40" rx="3" class="building" />

  <rect x="600" y="370" width="65" height="40" rx="3" class="building" />
  <rect x="680" y="380" width="55" height="35" rx="3" class="building" />
  <rect x="615" y="430" width="55" height="35" rx="3" class="building" />
  <rect x="690" y="430" width="60" height="40" rx="3" class="building" />

  <!-- Minor Streets (Grid Network) -->
  <path d="M 0,90 L 800,90" class="street-casing" />
  <path d="M 0,90 L 800,90" class="street" />

  <path d="M 0,410 L 800,410" class="street-casing" />
  <path d="M 0,410 L 800,410" class="street" />

  <path d="M 110,0 L 110,500" class="street-casing" />
  <path d="M 110,0 L 110,500" class="street" />

  <path d="M 700,0 L 700,500" class="street-casing" />
  <path d="M 700,0 L 700,500" class="street" />

  <!-- Diagonal Connector Streets -->
  <path d="M 0,290 L 320,250 L 500,250 L 800,320" class="street-casing" />
  <path d="M 0,290 L 320,250 L 500,250 L 800,320" class="street" />

  <!-- Main Roads (White Avenues) -->
  <path d="M 220,0 L 220,500" class="main-casing" />
  <path d="M 220,0 L 220,500" class="main-road" />

  <path d="M 580,0 L 580,500" class="main-casing" />
  <path d="M 580,0 L 580,500" class="main-road" />

  <path d="M 0,160 L 800,160" class="main-casing" />
  <path d="M 0,160 L 800,160" class="main-road" />

  <path d="M 0,330 L 800,330" class="main-casing" />
  <path d="M 0,330 L 800,330" class="main-road" />

  <!-- Arterial Highway / Primary Road (Yellow/Orange) -->
  <path d="M 400,0 L 400,180 Q 400,240 420,260 L 420,500" class="arterial-casing" />
  <path d="M 400,0 L 400,180 Q 400,240 420,260 L 420,500" class="arterial" />

  <path d="M 0,230 L 360,230 Q 400,230 420,250 L 800,250" class="arterial-casing" />
  <path d="M 0,230 L 360,230 Q 400,230 420,250 L 800,250" class="arterial" />

  <!-- Metro Line -->
  <path d="M 30,500 L 220,330 L 370,230 L 750,50" class="metro-casing" />

  <!-- Area & Street Labels -->
  <text x="70" y="275" class="label-area">Industrial Area Phase II</text>
  <text x="560" y="295" class="label-area">Rajajinagar</text>

  <text x="230" y="45" class="label-road" transform="rotate(90 230,45)">10th Main Road</text>
  <text x="590" y="45" class="label-road" transform="rotate(90 590,45)">Dr. Rajkumar Road</text>
  <text x="410" y="70" class="label-road" transform="rotate(90 410,70)">Chord Road</text>
  <text x="30" y="152" class="label-road">11th Cross Road</text>
  <text x="30" y="322" class="label-road">10th Cross Road</text>
  <text x="610" y="242" class="label-road">West of Chord Rd</text>

  <!-- Landmark POIs -->
  <g transform="translate(620, 195)">
    <circle cx="0" cy="0" r="10" fill="#9333ea" />
    <path d="M-4,-3 L-4,3 L3,0 Z" fill="#ffffff"/>
    <text x="14" y="4" class="label-spot">Navrang Cinemas</text>
  </g>

  <g transform="translate(200, 360)">
    <circle cx="0" cy="0" r="9" fill="#0284c7" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <text x="14" y="4" class="label-spot">Metro Station (Green Line)</text>
  </g>

  <!-- Central Pulsing Radius for Workshop Location -->
  <circle cx="410" cy="225" r="45" fill="#D4451A" opacity="0.12">
    <animate attributeName="r" values="30;55;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="225" r="18" fill="#D4451A" opacity="0.25" />

  <!-- Location Pin Shadow -->
  <ellipse cx="410" cy="235" rx="14" ry="6" fill="#000000" opacity="0.3" filter="url(#pin-shadow)" />

  <!-- Premium Custom Location Pin -->
  <g transform="translate(410, 225)" filter="url(#pin-shadow)">
    <!-- Pin Body -->
    <path d="M 0,0 C -16,-16 -24,-30 -24,-44 C -24,-58 -13,-68 0,-68 C 13,-68 24,-58 24,-44 C 24,-30 16,-16 0,0 Z" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- White Circle Inner -->
    <circle cx="0" cy="-44" r="14" fill="#FFFFFF" />
    <!-- Motorcycle Silhouette Icon in Pin -->
    <g transform="translate(-10, -52) scale(0.04)">
      <path fill="#D4451A" d="M400 96a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm-12 108.5L343.8 176H272c-17.7 0-32 14.3-32 32v16c0 8.8 7.2 16 16 16h64l24 32h-88c-13.3 0-24 10.7-24 24v16c0 13.3 10.7 24 24 24h120c13.3 0 24-10.7 24-24v-48.5c0-12.7-5.1-24.9-14.1-33.9zM128 352a96 96 0 1 0 0-192 96 96 0 1 0 0 192zm256 0a96 96 0 1 0 0-192 96 96 0 1 0 0 192z"/>
    </g>
  </g>

  <!-- Location Info Card Floating Above Pin -->
  <g transform="translate(290, 85)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="62" rx="10" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Orange accent bar -->
    <rect x="0" y="0" width="6" height="62" rx="3" fill="#D4451A"/>
    <!-- Text Info -->
    <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1B1F24">Moto Service Pro</text>
    <text x="18" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748B">Industrial Area Phase II, Rajaji Nagar</text>
    <!-- Stars -->
    <g transform="translate(18, 44)">
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EAB308">★★★★★</text>
      <text x="50" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#475569">4.9 (520+ reviews)</text>
    </g>
    <!-- Mini logo badge -->
    <circle cx="212" cy="24" r="12" fill="#FFF5F2"/>
    <path transform="translate(205, 17) scale(0.028)" fill="#D4451A" d="M400 96a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm-12 108.5L343.8 176H272c-17.7 0-32 14.3-32 32v16c0 8.8 7.2 16 16 16h64l24 32h-88c-13.3 0-24 10.7-24 24v16c0 13.3 10.7 24 24 24h120c13.3 0 24-10.7 24-24v-48.5c0-12.7-5.1-24.9-14.1-33.9zM128 352a96 96 0 1 0 0-192 96 96 0 1 0 0 192zm256 0a96 96 0 1 0 0-192 96 96 0 1 0 0 192z"/>
  </g>

  <!-- Google Map Branding / Navigation Hint in Bottom Right -->
  <g transform="translate(620, 455)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="url(#badgeGrad)"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Get Directions ➔</text>
  </g>
</svg>
