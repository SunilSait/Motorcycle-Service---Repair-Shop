<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tvsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <filter id="tvsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#D90429" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Leaping Stallion Symbol -->
  <g filter="url(#tvsGlow)" transform="translate(10, -5)">
    <!-- Horse Head & Mane -->
    <path d="M 125 42 C 115 39, 95 45, 85 55 C 82 49, 75 47, 70 49 C 68 55, 72 62, 78 65 C 72 69, 65 71, 58 72 C 62 79, 70 82, 82 79 C 78 85, 70 91, 60 93 C 70 97, 85 95, 95 87 C 92 95, 86 103, 75 107 C 88 109, 105 102, 115 92 C 122 85, 130 72, 138 67 C 146 62, 155 61, 158 55 C 150 51, 138 49, 132 43 Z" fill="url(#tvsRed)"/>
    <!-- Horse Front Legs -->
    <path d="M 115 92 L 142 103 L 150 98 L 128 85 Z" fill="url(#tvsRed)"/>
    <path d="M 108 95 L 128 114 L 136 110 L 120 91 Z" fill="url(#tvsRed)"/>
  </g>

  <!-- TVS Bold Typography in Pure White -->
  <text x="100" y="152" font-family="'Arial Black', 'Impact', sans-serif" font-size="32" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">TVS</text>
  
  <!-- Tricolor Racing Underline -->
  <rect x="48" y="165" width="32" height="5" rx="2.5" fill="#FF9933"/>
  <rect x="84" y="165" width="32" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="120" y="165" width="32" height="5" rx="2.5" fill="#10B981"/>
</svg>
