<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="reGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5B700"/>
      <stop offset="100%" stop-color="#D49A00"/>
    </linearGradient>
    <linearGradient id="reRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60026"/>
      <stop offset="100%" stop-color="#8A0012"/>
    </linearGradient>
    <filter id="reGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F5B700" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Crown / Top Crest -->
  <g filter="url(#reGlow)">
    <path d="M 80 38 L 85 48 L 95 38 L 100 50 L 105 38 L 115 48 L 120 38 L 116 54 L 84 54 Z" fill="url(#reGold)"/>
    
    <!-- Left Wing Feathers -->
    <path d="M 76 62 C 56 56, 30 62, 14 78 C 30 74, 52 74, 68 76 Z" fill="url(#reGold)"/>
    <path d="M 74 76 C 54 74, 34 82, 20 96 C 38 92, 56 90, 70 90 Z" fill="url(#reGold)"/>
    <path d="M 74 90 C 58 90, 42 98, 30 110 C 46 106, 60 102, 70 100 Z" fill="url(#reGold)"/>

    <!-- Right Wing Feathers -->
    <path d="M 124 62 C 144 56, 170 62, 186 78 C 170 74, 148 74, 132 76 Z" fill="url(#reGold)"/>
    <path d="M 126 76 C 146 74, 166 82, 180 96 C 162 92, 144 90, 130 90 Z" fill="url(#reGold)"/>
    <path d="M 126 90 C 142 90, 158 98, 170 110 C 154 106, 140 102, 130 100 Z" fill="url(#reGold)"/>

    <!-- Center Shield Badge -->
    <path d="M 74 58 Q 100 52 126 58 Q 130 96 100 124 Q 70 96 74 58 Z" fill="url(#reRed)" stroke="url(#reGold)" stroke-width="3"/>
    
    <!-- Shield Monogram R -->
    <path d="M 91 72 L 103 72 C 109 72, 112 75, 112 79 C 112 83, 109 86, 103 86 L 97 86 L 97 93 L 91 93 Z M 97 77 L 97 81 L 103 81 C 105 81, 107 80, 107 79 C 107 78, 105 77, 103 77 Z" fill="url(#reGold)"/>
    <path d="M 100 86 L 110 104 L 103 104 L 95 87 Z" fill="url(#reGold)"/>
  </g>

  <!-- ROYAL ENFIELD Typography -->
  <text x="100" y="148" font-family="'Cinzel', 'Georgia', serif" font-size="14.5" font-weight="900" letter-spacing="2.5" fill="url(#reGold)" text-anchor="middle">ROYAL</text>
  <text x="100" y="167" font-family="'Cinzel', 'Georgia', serif" font-size="15.5" font-weight="900" letter-spacing="3" fill="url(#reGold)" text-anchor="middle">ENFIELD</text>
  <text x="100" y="181" font-family="'Arial', sans-serif" font-size="7.5" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">MADE LIKE A GUN</text>
</svg>
