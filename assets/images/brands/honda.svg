<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hondaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#E00000"/>
    </linearGradient>
    <filter id="hondaGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF0000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Honda Wing Symbol -->
  <g filter="url(#hondaGlow)" transform="translate(10, -5)">
    <!-- Top Feather -->
    <path d="M 38 100 C 45 75, 78 40, 160 32 C 158 38, 140 52, 124 58 C 102 66, 76 76, 54 104 Z" fill="url(#hondaRed)"/>
    <!-- Middle Tier 1 -->
    <path d="M 36 106 C 45 86, 74 58, 142 50 C 136 56, 118 67, 104 73 C 84 81, 66 91, 48 112 Z" fill="url(#hondaRed)"/>
    <!-- Middle Tier 2 -->
    <path d="M 34 114 C 43 98, 68 74, 124 68 C 118 74, 102 83, 88 89 C 72 96, 56 105, 42 120 Z" fill="url(#hondaRed)"/>
    <!-- Bottom Tier 3 -->
    <path d="M 32 122 C 40 108, 62 89, 106 86 C 100 91, 86 99, 74 104 C 60 110, 48 116, 38 126 Z" fill="url(#hondaRed)"/>
    <!-- Base Wing Body -->
    <path d="M 30 130 C 35 116, 50 102, 86 101 C 80 106, 68 113, 58 117 C 46 122, 38 127, 33 133 Z" fill="url(#hondaRed)"/>
  </g>
  
  <!-- HONDA Bold White Wordmark -->
  <text x="100" y="165" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">HONDA</text>
</svg>
