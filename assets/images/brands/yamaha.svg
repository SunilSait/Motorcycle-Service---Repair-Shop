<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="yamahaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#E60012"/>
    </linearGradient>
    <filter id="yamahaGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E60012" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Tuning Forks Outer Circle -->
  <g filter="url(#yamahaGlow)">
    <circle cx="100" cy="78" r="50" fill="none" stroke="url(#yamahaRed)" stroke-width="7"/>
    <!-- Central Ring -->
    <circle cx="100" cy="78" r="14" fill="none" stroke="url(#yamahaRed)" stroke-width="6"/>
    <!-- Center Dot -->
    <circle cx="100" cy="78" r="4.5" fill="url(#yamahaRed)"/>

    <!-- 3 Tuning Forks -->
    <g transform="translate(100, 78)">
      <!-- Top -->
      <path d="M -3 -14 L -3 -36 C -3 -42, -9 -46, -15 -48 L -15 -38 C -9 -36, -7 -34, -7 -28 L -7 -14 Z" fill="url(#yamahaRed)"/>
      <path d="M 3 -14 L 3 -36 C 3 -42, 9 -46, 15 -48 L 15 -38 C 9 -36, 7 -34, 7 -28 L 7 -14 Z" fill="url(#yamahaRed)"/>
      
      <!-- Bottom Right (120 deg) -->
      <g transform="rotate(120)">
        <path d="M -3 -14 L -3 -36 C -3 -42, -9 -46, -15 -48 L -15 -38 C -9 -36, -7 -34, -7 -28 L -7 -14 Z" fill="url(#yamahaRed)"/>
        <path d="M 3 -14 L 3 -36 C 3 -42, 9 -46, 15 -48 L 15 -38 C 9 -36, 7 -34, 7 -28 L 7 -14 Z" fill="url(#yamahaRed)"/>
      </g>

      <!-- Bottom Left (240 deg) -->
      <g transform="rotate(240)">
        <path d="M -3 -14 L -3 -36 C -3 -42, -9 -46, -15 -48 L -15 -38 C -9 -36, -7 -34, -7 -28 L -7 -14 Z" fill="url(#yamahaRed)"/>
        <path d="M 3 -14 L 3 -36 C 3 -42, 9 -46, 15 -48 L 15 -38 C 9 -36, 7 -34, 7 -28 L 7 -14 Z" fill="url(#yamahaRed)"/>
      </g>
    </g>
  </g>

  <!-- YAMAHA Bold White Wordmark -->
  <text x="100" y="165" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">YAMAHA</text>
</svg>
