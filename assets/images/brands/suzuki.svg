<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="suzukiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3344"/>
      <stop offset="100%" stop-color="#D60012"/>
    </linearGradient>
    <filter id="suzukiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#D60012" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Iconic Angular S Emblem -->
  <g filter="url(#suzukiGlow)">
    <!-- Top Half of S -->
    <path d="M 64 32 L 144 32 L 158 46 L 96 80 L 142 80 L 120 95 L 56 95 L 42 81 L 104 47 L 64 47 Z" fill="url(#suzukiRed)"/>
    <!-- Bottom Half of S -->
    <path d="M 136 142 L 56 142 L 42 128 L 104 94 L 58 94 L 80 79 L 144 79 L 158 93 L 96 127 L 136 127 Z" fill="url(#suzukiRed)"/>
  </g>

  <!-- SUZUKI Wordmark in Pure White -->
  <text x="100" y="172" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SUZUKI</text>
</svg>
