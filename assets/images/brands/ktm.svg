<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ktmOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- High-contrast Badge Background in KTM Racing Orange -->
  <rect width="200" height="200" rx="36" fill="url(#ktmOrange)"/>

  <!-- KTM Bold Dynamic Block Letterforms Perfectly Centered -->
  <g transform="translate(100, 82)">
    <!-- Slanted KTM Letters Group with exact geometric centering -->
    <g transform="skewX(-14) translate(-75, -34)">
      <!-- Letter K -->
      <path d="M 0 0 L 14 0 L 14 26 L 35 0 L 52 0 L 25 32 L 54 68 L 37 68 L 14 39 L 14 68 L 0 68 Z" fill="#000000"/>
      
      <!-- Letter T -->
      <path d="M 52 0 L 92 0 L 92 14 L 79 14 L 79 68 L 65 68 L 65 14 L 52 14 Z" fill="#000000"/>

      <!-- Letter M -->
      <path d="M 95 0 L 112 0 L 122 38 L 132 0 L 149 0 L 149 68 L 135 68 L 135 24 L 126 56 L 118 56 L 109 24 L 109 68 L 95 68 Z" fill="#000000"/>
    </g>
  </g>

  <!-- Ready to Race subtext in Black/White Perfectly Centered -->
  <rect x="25" y="142" width="150" height="26" rx="6" fill="#000000"/>
  <text x="100" y="160" font-family="'Arial Black', 'Impact', sans-serif" font-size="10.5" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">READY TO RACE</text>
</svg>
