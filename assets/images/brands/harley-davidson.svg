<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hdOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7518"/>
      <stop offset="100%" stop-color="#E55B00"/>
    </linearGradient>
    <filter id="hdGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#FF7518" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <g filter="url(#hdGlow)">
    <!-- Top Cap of Shield -->
    <polygon points="100,24 154,46 154,68 46,68 46,46" fill="#0D1117" stroke="url(#hdOrange)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Bottom V of Shield -->
    <polygon points="46,112 154,112 154,132 100,176 46,132" fill="#0D1117" stroke="url(#hdOrange)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Central Bar -->
    <rect x="20" y="68" width="160" height="44" rx="3" fill="#0D1117" stroke="url(#hdOrange)" stroke-width="3.5"/>

    <!-- Top Text: MOTOR -->
    <text x="100" y="55" font-family="'Arial Black', 'Impact', sans-serif" font-size="14.5" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">MOTOR</text>

    <!-- Main Bar Text: HARLEY-DAVIDSON -->
    <text x="100" y="96" font-family="'Arial Black', 'Impact', sans-serif" font-size="12.5" font-weight="900" letter-spacing="0.5" fill="url(#hdOrange)" text-anchor="middle">HARLEY-DAVIDSON</text>

    <!-- Bottom Text: CYCLES -->
    <text x="100" y="146" font-family="'Arial Black', 'Impact', sans-serif" font-size="14.5" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">CYCLES</text>
  </g>
</svg>
