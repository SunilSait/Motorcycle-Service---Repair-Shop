<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ducatiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#C00000"/>
    </linearGradient>
    <linearGradient id="ducatiSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="ducatiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#FF2A2A" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Triangular Racing Shield -->
  <g filter="url(#ducatiGlow)" transform="translate(0, 5)">
    <path d="M 40 28 L 160 28 L 100 162 Z" fill="url(#ducatiRed)" stroke="url(#ducatiSilver)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Top Header Bar for text -->
    <path d="M 44 32 L 156 32 L 150 60 L 50 60 Z" fill="#990000"/>

    <!-- Dynamic Slicing White Curve / Road Ribbon -->
    <path d="M 50 66 C 65 66, 110 80, 120 112 C 126 130, 112 144, 100 154 C 105 137, 110 117, 95 97 C 85 84, 58 76, 50 66 Z" fill="#FFFFFF"/>
    
    <!-- DUCATI Wordmark on Shield in Pure White -->
    <text x="100" y="52" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="16" font-weight="900" letter-spacing="2.5" fill="#FFFFFF" text-anchor="middle">DUCATI</text>
  </g>
</svg>
