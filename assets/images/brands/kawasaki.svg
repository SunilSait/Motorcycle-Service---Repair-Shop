<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kawaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#55B300"/>
    </linearGradient>
    <filter id="kawaGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#76FF03" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Kawasaki River Mark / Iconic K Emblem -->
  <g filter="url(#kawaGlow)" transform="translate(10, 0)">
    <!-- Vertical Bar of K -->
    <path d="M 42 38 L 66 38 L 66 128 L 42 128 Z" fill="url(#kawaGreen)"/>
    <!-- Upper Wing of K -->
    <path d="M 66 84 L 126 38 L 154 38 L 94 84 Z" fill="url(#kawaGreen)"/>
    <!-- Lower Wing of K -->
    <path d="M 80 74 L 154 128 L 126 128 L 66 84 Z" fill="url(#kawaGreen)"/>
  </g>

  <!-- Kawasaki Typography -->
  <text x="100" y="168" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="21" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">KAWASAKI</text>
</svg>
