<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bmwBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="bmwGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0099FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <g filter="url(#bmwGlow)">
    <!-- Outer Chrome Ring -->
    <circle cx="100" cy="100" r="78" fill="#0F172A" stroke="url(#chromeRing)" stroke-width="4"/>
    <circle cx="100" cy="100" r="48" fill="none" stroke="url(#chromeRing)" stroke-width="2.5"/>

    <!-- BMW Text arched along the ring -->
    <text x="72" y="58" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(-30 72 58)">B</text>
    <text x="100" y="50" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="128" y="58" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(30 128 58)">W</text>

    <!-- Center 4 Quadrants -->
    <!-- Top-Left Blue -->
    <path d="M 100 100 L 100 52 A 48 48 0 0 0 52 100 Z" fill="url(#bmwBlue)"/>
    <!-- Top-Right White -->
    <path d="M 100 100 L 148 100 A 48 48 0 0 0 100 52 Z" fill="#FFFFFF"/>
    <!-- Bottom-Right Blue -->
    <path d="M 100 100 L 100 148 A 48 48 0 0 0 148 100 Z" fill="url(#bmwBlue)"/>
    <!-- Bottom-Left White -->
    <path d="M 100 100 L 52 100 A 48 48 0 0 0 100 148 Z" fill="#FFFFFF"/>

    <!-- Center Crosslines -->
    <line x1="100" y1="52" x2="100" y2="148" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="52" y1="100" x2="148" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
</svg>
