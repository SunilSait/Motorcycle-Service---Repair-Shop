<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bajajBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <linearGradient id="bajajLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="bajajGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0091EA" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Dynamic Flying B Emblem / Dual Wing Chevrons -->
  <g filter="url(#bajajGlow)" transform="translate(10, 0)">
    <!-- Top Flying Wing -->
    <path d="M 42 62 C 64 44, 108 40, 145 64 C 125 73, 92 73, 66 80 L 42 62 Z" fill="url(#bajajLight)"/>
    <path d="M 66 80 C 96 78, 128 76, 152 92 C 132 100, 100 98, 76 104 L 66 80 Z" fill="url(#bajajBlue)"/>
    
    <!-- Central Interlocking Wing -->
    <path d="M 42 62 L 76 104 C 52 104, 42 90, 42 62 Z" fill="url(#bajajBlue)"/>

    <!-- Lower Wing -->
    <path d="M 45 106 C 72 104, 118 106, 146 128 C 120 135, 88 133, 58 140 L 45 106 Z" fill="url(#bajajLight)"/>
    <path d="M 58 140 C 42 140, 39 125, 45 106 Z" fill="url(#bajajBlue)"/>
  </g>

  <!-- BAJAJ Wordmark in Bright White -->
  <text x="100" y="170" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="24" font-weight="900" letter-spacing="3.5" fill="#FFFFFF" text-anchor="middle">BAJAJ</text>
</svg>
