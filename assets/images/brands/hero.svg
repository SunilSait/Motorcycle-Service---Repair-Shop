<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="heroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <filter id="heroGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge for High Contrast -->
  <rect width="200" height="200" rx="36" fill="#181D24" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- 3D Folded H Emblem -->
  <g filter="url(#heroGlow)">
    <!-- Left Column (Clean Bright White) -->
    <path d="M 60 38 L 82 38 L 82 120 L 60 120 Z" fill="#FFFFFF"/>
    
    <!-- Red Angular Bridge Top -->
    <path d="M 82 38 L 140 38 L 140 60 L 82 60 Z" fill="url(#heroRed)"/>
    
    <!-- Center Red Diagonal Ribbon -->
    <polygon points="82,62 140,38 140,74 82,98" fill="url(#heroRed)"/>

    <!-- Right Column Bottom (Clean Bright White) -->
    <path d="M 118 74 L 140 74 L 140 120 L 118 120 Z" fill="#FFFFFF"/>
  </g>

  <!-- Hero Typography -->
  <text x="100" y="156" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">Hero</text>
  <text x="100" y="174" font-family="'Arial', sans-serif" font-size="9" font-weight="800" letter-spacing="3" fill="url(#heroRed)" text-anchor="middle">MOTOCORP</text>
</svg>
